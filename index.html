<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Finder - Best Gaming Deals</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background: #333; color: #fff; padding: 2rem 0; }
        main { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .console-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; width: 300px; margin: 15px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .console-card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 15px; }
        .price { display: block; font-weight: bold; font-size: 1.2rem; margin: 15px 0; color: #e67e22; }
        .check-btn { display: inline-block; background-color: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .check-btn:hover { background-color: #219150; }
        footer { padding: 20px; background: #333; color: #fff; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>Console Finder</h1>
        <p>Find the best prices for gaming consoles worldwide!</p>
    </header>

    <main>
        <div class="console-card">
            <img src="slike/Ps5.png" alt="PlayStation 5 Slim">
            <h2>PlayStation 5 Slim</h2>
            <p>The ultimate gaming experience.</p>
            <span class="price">$499.99 / £479.99</span>
            <br>
            <a href="https://www.amazon.com/dp/B0CL8H37Q1?tag=kova9901-20" target="_blank" class="check-btn">Check Price</a>
        </div>

        <div class="console-card">
            <img src="slike/Nintendo.jpeg" alt="Nintendo Switch OLED">
            <h2>Nintendo Switch OLED</h2>
            <p>Play at home or on the go.</p>
            <span class="price">$349.99 / £309.99</span>
            <br>
            <a href="https://www.amazon.com/dp/B098RL6SB9?tag=kova9901-20" target="_blank" class="check-btn">Check Price</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Console Finder. All rights reserved.</p>
    </footer>
</body>
</html>
