<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Finder Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; }
        header { background: #1a1a1a; color: #fff; padding: 2.5rem 1rem; text-align: center; }
        header h1 { margin: 0; font-size: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 25px; max-width: 1100px; margin: auto; }
        .card { background: white; border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; }
        .price { font-size: 1.5rem; color: #e67e22; font-weight: bold; margin: 15px 0; }
        .btn { display: block; background: #95a5a6; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1.1px; cursor: default; }
        footer { text-align: center; padding: 40px 20px; font-size: 0.9rem; color: #777; border-top: 1px solid #ddd; margin-top: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>Console Finder Pro</h1>
        <p>Compare the best gaming deals in one place</p>
    </header>

    <div class="grid">
        <!-- PlayStation 5 -->
        <div class="card">
            <img src="slike/Ps5.png" alt="PS5">
            <h2>PlayStation 5 Slim</h2>
            <div class="price">$499.00</div>
            <div class="btn">View Product</div>
        </div>

        <!-- Nintendo Switch -->
        <div class="card">
            <img src="slike/Nintendo.jpeg" alt="Nintendo Switch">
            <h2>Nintendo Switch OLED</h2>
            <div class="price">$349.00</div>
            <div class="btn">View Product</div>
        </div>

        <!-- Xbox Series X -->
        <div class="card">
            <img src="slike/xbox.png" alt="Xbox Series X">
            <h2>Xbox Series X</h2>
            <div class="price">$499.00</div>
            <div class="btn">View Product</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Console Finder Pro. All rights reserved.</p>
    </footer>

</body>
</html>
