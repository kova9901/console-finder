
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Finder Pro</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 10px; width: 250px; }
        img { width: 150px; }
    </style>
</head>
<body>
    <h1>Console Finder</h1>
    <div class="grid">
        <div class="card">
            <img src="slike/Ps5.png" alt="PS5">
            <h2>PS5 Slim</h2>
        </div>
        <div class="card">
            <img src="slike/Nintendo.jpeg" alt="Switch">
            <h2>Switch OLED</h2>
        </div>
    </div>
</body>
</html>
